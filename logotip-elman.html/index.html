<!DOCTYPE html>
<?xml encoding="utf-8" ?><html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#1040;&#1085;&#1080;&#1084;&#1072;&#1094;&#1080;&#1103; &#1083;&#1086;&#1075;&#1086;&#1090;&#1080;&#1087;&#1072; &#1074; &#1096;&#1077;&#1089;&#1090;&#1077;&#1088;&#1105;&#1085;&#1082;&#1077;</title>
  <style>
    :root {
      --scene-size: 420px;
      --gear-duration: 6s;
      --logo-scale: 0.58;
      --gear-scale: 1;
      --bg: #000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: #fff;
      display: grid;
      grid-template-columns: minmax(320px, 440px) 1fr;
    }

    .panel {
      padding: 24px;
      border-right: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
    }

    .panel h1 {
      margin: 0 0 18px;
      font-size: 22px;
      line-height: 1.2;
    }

    .panel p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.8);
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 10px;
      background: #e00000;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button.secondary {
      background: rgba(255,255,255,0.12);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: var(--scene-size);
      height: var(--scene-size);
      display: grid;
      place-items: center;
    }

    .gear {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(var(--gear-scale));
      animation: spin var(--gear-duration) linear infinite;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      pointer-events: none;
    }

    .logo {
      position: absolute;
      width: calc(var(--scene-size) * var(--logo-scale));
      height: calc(var(--scene-size) * var(--logo-scale));
      object-fit: contain;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    .scene.reverse .gear {
      animation-direction: reverse;
    }

    .scene.paused .gear {
      animation-play-state: paused;
    }

    @keyframes spin {
      from { transform: rotate(0deg) scale(var(--gear-scale)); }
      to { transform: rotate(360deg) scale(var(--gear-scale)); }
    }

    .code-note {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255,255,255,0.65);
    }

    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      :root {
        --scene-size: min(78vw, 420px);
      }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <h1>&#1051;&#1086;&#1075;&#1086;&#1090;&#1080;&#1087; &#1074; &#1096;&#1077;&#1089;&#1090;&#1077;&#1088;&#1105;&#1085;&#1082;&#1077;</h1>
    <p>&#1064;&#1077;&#1089;&#1090;&#1077;&#1088;&#1105;&#1085;&#1082;&#1072; &#1074;&#1088;&#1072;&#1097;&#1072;&#1077;&#1090;&#1089;&#1103;, &#1083;&#1086;&#1075;&#1086;&#1090;&#1080;&#1087; &#1086;&#1089;&#1090;&#1072;&#1105;&#1090;&#1089;&#1103; &#1087;&#1086; &#1094;&#1077;&#1085;&#1090;&#1088;&#1091;. &#1055;&#1072;&#1088;&#1072;&#1084;&#1077;&#1090;&#1088;&#1099; &#1084;&#1086;&#1078;&#1085;&#1086; &#1084;&#1077;&#1085;&#1103;&#1090;&#1100; &#1095;&#1077;&#1088;&#1077;&#1079; &#1080;&#1085;&#1090;&#1077;&#1088;&#1092;&#1077;&#1081;&#1089; &#1080;&#1083;&#1080; &#1080;&#1079; JavaScript.</p>

    <div class="controls">
      <div class="control">
        <label for="speedRange">
          <span>&#1057;&#1082;&#1086;&#1088;&#1086;&#1089;&#1090;&#1100; &#1074;&#1088;&#1072;&#1097;&#1077;&#1085;&#1080;&#1103;</span>
          <strong><span id="speedValue">6</span> &#1089;&#1077;&#1082;/&#1086;&#1073;&#1086;&#1088;&#1086;&#1090;</strong>
        </label>
        <input id="speedRange" type="range" min="1" max="20" step="0.5" value="6">
      </div>

      <div class="control">
        <label for="sceneSizeRange">
          <span>&#1056;&#1072;&#1079;&#1084;&#1077;&#1088; &#1089;&#1094;&#1077;&#1085;&#1099;</span>
          <strong><span id="sceneSizeValue">420</span> px</strong>
        </label>
        <input id="sceneSizeRange" type="range" min="180" max="800" step="10" value="420">
      </div>

      <div class="control">
        <label for="logoScaleRange">
          <span>&#1056;&#1072;&#1079;&#1084;&#1077;&#1088; &#1083;&#1086;&#1075;&#1086;&#1090;&#1080;&#1087;&#1072;</span>
          <strong><span id="logoScaleValue">58</span>%</strong>
        </label>
        <input id="logoScaleRange" type="range" min="20" max="90" step="1" value="58">
      </div>

      <div class="control">
        <label for="gearScaleRange">
          <span>&#1052;&#1072;&#1089;&#1096;&#1090;&#1072;&#1073; &#1096;&#1077;&#1089;&#1090;&#1077;&#1088;&#1105;&#1085;&#1082;&#1080;</span>
          <strong><span id="gearScaleValue">100</span>%</strong>
        </label>
        <input id="gearScaleRange" type="range" min="70" max="130" step="1" value="100">
      </div>

      <label class="checkbox">
        <input id="reverseCheckbox" type="checkbox">
        <span>&#1042;&#1088;&#1072;&#1097;&#1072;&#1090;&#1100; &#1074; &#1086;&#1073;&#1088;&#1072;&#1090;&#1085;&#1091;&#1102; &#1089;&#1090;&#1086;&#1088;&#1086;&#1085;&#1091;</span>
      </label>

      <div class="row">
        <button id="toggleBtn" type="button">&#1055;&#1072;&#1091;&#1079;&#1072;</button>
        <button id="resetBtn" class="secondary" type="button">&#1057;&#1073;&#1088;&#1086;&#1089;</button>
      </div>
    </div>

    <div class="code-note">
      &#1055;&#1091;&#1090;&#1080; &#1082; &#1080;&#1079;&#1086;&#1073;&#1088;&#1072;&#1078;&#1077;&#1085;&#1080;&#1103;&#1084; &#1091;&#1078;&#1077; &#1087;&#1086;&#1076;&#1082;&#1083;&#1102;&#1095;&#1077;&#1085;&#1099;:<br>
      <code>images/elman_logo/shest.png</code><br>
      <code>images/elman_logo/logo.png</code>
    </div>
  </aside>

  <main class="stage">
    <div class="scene" id="scene">
      <img class="gear" src="/powercube/site_mirror/_static/images/elman_logo/shest.png" alt="&#1064;&#1077;&#1089;&#1090;&#1077;&#1088;&#1105;&#1085;&#1082;&#1072;">
      <img class="logo" src="/powercube/site_mirror/_static/images/elman_logo/logo.png" alt="&#1051;&#1086;&#1075;&#1086;&#1090;&#1080;&#1087;">
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const scene = document.getElementById('scene');

    const speedRange = document.getElementById('speedRange');
    const sceneSizeRange = document.getElementById('sceneSizeRange');
    const logoScaleRange = document.getElementById('logoScaleRange');
    const gearScaleRange = document.getElementById('gearScaleRange');
    const reverseCheckbox = document.getElementById('reverseCheckbox');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');

    const speedValue = document.getElementById('speedValue');
    const sceneSizeValue = document.getElementById('sceneSizeValue');
    const logoScaleValue = document.getElementById('logoScaleValue');
    const gearScaleValue = document.getElementById('gearScaleValue');

    const defaults = {
      speed: 6,
      sceneSize: 420,
      logoScale: 58,
      gearScale: 100,
      reverse: false,
      paused: false,
    };

    function applyState() {
      const speed = parseFloat(speedRange.value);
      const sceneSize = parseInt(sceneSizeRange.value, 10);
      const logoScale = parseInt(logoScaleRange.value, 10);
      const gearScale = parseInt(gearScaleRange.value, 10);
      const reverse = reverseCheckbox.checked;

      root.style.setProperty('--gear-duration', `${speed}s`);
      root.style.setProperty('--scene-size', `${sceneSize}px`);
      root.style.setProperty('--logo-scale', (logoScale / 100).toString());
      root.style.setProperty('--gear-scale', (gearScale / 100).toString());

      speedValue.textContent = speed;
      sceneSizeValue.textContent = sceneSize;
      logoScaleValue.textContent = logoScale;
      gearScaleValue.textContent = gearScale;

      scene.classList.toggle('reverse', reverse);
    }

    function setPaused(paused) {
      scene.classList.toggle('paused', paused);
      toggleBtn.textContent = paused ? '&#1047;&#1072;&#1087;&#1091;&#1089;&#1090;&#1080;&#1090;&#1100;' : '&#1055;&#1072;&#1091;&#1079;&#1072;';
      toggleBtn.dataset.paused = String(paused);
    }

    speedRange.addEventListener('input', applyState);
    sceneSizeRange.addEventListener('input', applyState);
    logoScaleRange.addEventListener('input', applyState);
    gearScaleRange.addEventListener('input', applyState);
    reverseCheckbox.addEventListener('change', applyState);

    toggleBtn.addEventListener('click', () => {
      const paused = toggleBtn.dataset.paused !== 'true';
      setPaused(paused);
    });

    resetBtn.addEventListener('click', () => {
      speedRange.value = defaults.speed;
      sceneSizeRange.value = defaults.sceneSize;
      logoScaleRange.value = defaults.logoScale;
      gearScaleRange.value = defaults.gearScale;
      reverseCheckbox.checked = defaults.reverse;
      applyState();
      setPaused(defaults.paused);
    });

    applyState();
    setPaused(false);

    // &#1055;&#1088;&#1080;&#1084;&#1077;&#1088; &#1087;&#1088;&#1086;&#1075;&#1088;&#1072;&#1084;&#1084;&#1085;&#1086;&#1075;&#1086; &#1091;&#1087;&#1088;&#1072;&#1074;&#1083;&#1077;&#1085;&#1080;&#1103;:
    // root.style.setProperty('--gear-duration', '3s');
    // scene.classList.add('reverse');
    // scene.classList.add('paused');
  </script>
</body>
</html>
